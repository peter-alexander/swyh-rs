name: Publish MP3 Preview Release

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/publish-mp3-preview.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: swyh-rs-windows-mp3
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35354503228

      - name: Verify packaged files
        run: unzip -l artifact/swyh-rs-windows-mp3.zip

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.21.1-mp3.1
          target_commitish: d86ad426714ca6add8a878b46bdbaa2593e86564
          name: swyh-rs 1.21.1 MP3 preview 1
          prerelease: true
          body: |
            Windows x86-64 preview build of the swyh-rs fork with live MP3 streaming.

            MP3 endpoint:
            `http://127.0.0.1:5901/stream/swyh.mp3`

            MP3 is encoded as live VBR targeting about 192 kbps. The ZIP contains:
            - `swyh-rs.exe` — GUI
            - `swyh-rs-cli.exe` — CLI
            - `BUILD.txt` — build metadata

            The binaries were built after the MP3 feature commit `d86ad426714ca6add8a878b46bdbaa2593e86564`;
            subsequent source changes before the build affected CI workflow files only.
          files: artifact/swyh-rs-windows-mp3.zip
