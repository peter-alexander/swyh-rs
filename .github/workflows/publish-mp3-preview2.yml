name: Publish MP3 Preview 2

on:
  workflow_run:
    workflows: ["Windows Release Build"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == '920a641e9a11bf27a1829601279bd5c60ca7d818' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: swyh-rs-windows-mp3
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify packaged files
        run: unzip -l artifact/swyh-rs-windows-mp3.zip

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.21.1-mp3.2
          target_commitish: 176dc88c414ec7674cd5f78b5cde3da07836481e
          name: swyh-rs 1.21.1 MP3 preview 2
          prerelease: true
          body: |
            Windows x86-64 preview 2 with live MP3 compatibility fixes.

            Changes since preview 1:
            - MP3 now uses 320 kbps CBR on rusty_mp3's immediate-frame/non-reservoir path.
            - MP3 HTTP requests are treated as non-seekable live radio streams and ignore Range probes.
            - Added a regression test that feeds many small stereo PCM chunks like CPAL does in practice.

            MP3 endpoint:
            `http://<PC-IP>:5901/stream/swyh.mp3`

            The ZIP contains:
            - `swyh-rs.exe`
            - `swyh-rs-cli.exe`
            - `BUILD.txt`

            Feature commit: `176dc88c414ec7674cd5f78b5cde3da07836481e`.
          files: artifact/swyh-rs-windows-mp3.zip
